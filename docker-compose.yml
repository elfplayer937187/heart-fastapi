services:
  mysql:
    image: mysql:8.0
    container_name: mental-health-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: mental_health_assistant
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 关键配置：启动时自动执行 SQL 文件建表+导入数据
      - ./mental_health_assistant.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data: